aid: pinch-payments
url: https://raw.githubusercontent.com/api-evangelist/pinch-payments/refs/heads/main/apis.yml
name: Pinch Payments
kind: company
description: 'Pinch Payments is an Australian, Brisbane-based payment orchestration and payment-facilitator
  platform that automates invoice collection and receivables for service businesses, bookkeepers, and
  software platforms across Australia and New Zealand. Marketing itself as "Aussie-Made Payments Infrastructure,"
  Pinch lets merchants accept direct debit (bank account) and card payments (Visa, Mastercard, American
  Express), build payment plans and subscriptions, tokenise payment sources client-side with its CaptureJS
  library, and reconcile settlements back into Xero, QuickBooks, and MYOB. Its Glassbox / Managed Merchants
  offering is a Payfac-as-a-Service seam with KYC, compliance, and sub-merchant onboarding for platforms
  acting as aggregators or marketplaces. Pinch is genuinely API-first: it ships a fully documented REST
  API (JSON, OAuth2 client-credentials auth), a ReadMe-hosted developer portal with a live API explorer,
  per-product OpenAPI 3.1 definitions, a published Postman collection, an official .NET SDK, Zapier/n8n/viaSocket
  no-code connectors, webhooks for real-time events, and an llms.txt + docs MCP server for AI-assisted
  integration.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payments
- Australia
- Payment Gateway
- Payment Processing
- Direct Debit
- Card Payments
- Subscriptions
- Billing
- Payment Facilitator
- Account-to-Account
- New Zealand
