test_bank_accounts_note: >-
  Any BSB / account number combination is accepted in test mode; use realistic-looking
  values (6-digit BSB, 5-9 digit account) to exercise your own UI validation.
failure_triggers:
  mechanism: >-
    Add a dishonour code prefixed with '#' anywhere in a payment `description` field or a
    payer `firstName` to force that specific failure in test mode.
  example: 'description: "Monthly membership #insufficient-funds"'
  codes: [insufficient-funds, temporary-problem, blocked-by-bank, invalid-card, invalid-account, unsupported-card, technical-error]
  reference: errors/pinch-payments-decline-codes.yml
end_to_end_direct_debit:
- Create a payer with a test bank account
- Schedule a payment for today
- Send a Time-Travel header set past the processing window to process it and fire a bank-results event
- Advance the date further to trigger settlement and a transfer event
