generated: '2026-07-24'
method: searched
source: https://docs.getpinch.com.au/docs/test-and-live-mode + https://docs.getpinch.com.au/docs/dishonour-codes
summary: >-
  Pinch runs test mode inside its production system — no separate sandbox account or
  login. The same Application/Merchant credentials work in both environments; the base
  URL path segment (/test/ vs /live/) selects the mode. Test mode performs every action
  without touching the bank, supports Time Travel to simulate scheduled/overnight
  processing instantly, and lets you deterministically trigger failure codes.
mode_separation:
  mechanism: base-url-path
  test_base: https://api.getpinch.com.au/test/
  live_base: https://api.getpinch.com.au/live/
  credentials: >-
    Same Application ID + Secret Key (or Merchant ID + Secret Key) in both modes; the
    base URL determines test vs live. CaptureJS uses a pk_test_... publishable key in test.
time_simulation:
  header: Time-Travel
  example: 'Time-Travel: 2026-08-01T09:45:59Z'
  behaviour: >-
    Treats the request as if it arrived at the given date/time, triggering scheduled
    payments, overnight direct-debit processing, and settlement/transfer logic that
    would otherwise take days. Ignored in live mode.
