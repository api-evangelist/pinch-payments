method: derived
source: mcp/pinch-payments-mcp.yml (tools/list) + openapi/*.yml
summary: >-
  Pinch's MCP server is documentation-native (ReadMe): its six tools operate OVER the
  OpenAPI specs (navigate/search/inspect) plus one generic live-request passthrough,
  rather than exposing one MCP tool per REST operation. There is therefore no 1:1
  tool->operationId binding to draw. Every MCP tool is recorded as mcp_only (a meta-tool),
  and all 56 REST operations are rest_only (reachable only via the generic execute-request
  passthrough, not a dedicated tool). This is an honest map of a spec-navigation MCP, not a
  gap to paper over.
surfaces:
  openapi: openapi/*.yml (10 product specs, 56 operations)
  mcp:
    url: https://docs.getpinch.com.au/mcp
    gated: false
    kind: docs-native (spec navigation + generic execute-request)
  graphql: null
crosswalk: []
mcp_only:
- tool: list-endpoints
  reason: OpenAPI-navigation meta-tool; lists paths/methods for a spec, not bound to one operation.
- tool: get-endpoint
  reason: OpenAPI-navigation meta-tool; inspects one path+method's schema/security, not an executable binding.
- tool: search-endpoints
  reason: OpenAPI-navigation meta-tool; keyword search across paths/params.
- tool: list-specs
  reason: OpenAPI-navigation meta-tool; enumerates the available product specs.
- tool: get-server-variables
  reason: OpenAPI-navigation meta-tool; returns server variables for a spec.
- tool: execute-request
  reason: >-
    Generic HAR-request passthrough to the live API; can invoke ANY of the 56 operations
    given a hand-built request, so it is not bound to a single operationId. Caller supplies
    their own OAuth Bearer token.
