                        refunds:
                          type: array
                        metadata: {}
                        nonce:
                          type: string
                          example: fdb06000-9d3f-4738-ab45-d8d9c7984e93
                - title: Nonce Doesn't Exist
                  type: object
                  properties:
                    isNonceReplay:
                      type: boolean
                      example: false
