                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: att_XXXXXXXX
                              amount:
                                type: integer
                                example: 1000
                              currency:
                                type: string
                                example: AUD
                              convertedAmount: {}
                              conversionRate: {}
                              convertedCurrency: {}
                              estimatedSettlementDate:
                                type: string
                                example: '2021-05-18T00:00:00'
                              isSurcharged:
                                type: boolean
                                example: false
                              transactionDate:
                                type: string
                                example: '2021-05-14T00:49:55.7510577Z'
                              estimatedTransferDate:
                                type: string
                                example: '2021-05-18'
                              actualTransferDate: {}
                              source: {}
                              dishonour: {}
                              settlement: {}
                              fees:
                                type: object
                                properties:
                                  transactionFee:
                                    type: integer
                                    example: 55
                                  applicationFee:
                                    type: integer
                                    example: 0
                                  totalFee:
                                    type: integer
                                    example: 55
                                  currency:
                                    type: string
                                    example: AUD
                                  taxRate:
                                    type: number
                                    example: 0.1
                                  convertedTransactionFee: {}
                                  convertedApplicationFee: {}
                                  convertedTotalFee: {}
                                  convertedCurrency: {}
                                  conversionRate: {}
                              status:
