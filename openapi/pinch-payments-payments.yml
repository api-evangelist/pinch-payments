                oneOf:
                - title: Nonce Exists
                  type: object
                  properties:
                    isNonceReplay:
                      type: boolean
                      example: true
                    nonce:
                      type: string
                      example: fdb06000-9d3f-4738-ab45-d8d9c7984e93
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                          example: pmt_XXXXXXXXXXXXXX
                        attemptId:
                          type: string
                          example: att_XXXXXXXXX
                        amount:
                          type: integer
                          example: 1000
                        currency:
                          type: string
                          example: AUD
                        description:
                          type: string
