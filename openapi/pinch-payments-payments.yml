  /payments/{id}:
    delete:
      summary: Delete payment
      description: ''
      operationId: delete-payment
      parameters:
      - name: id
        in: path
        description: Payment Id in pmt_XXXXXXXXXXXXXX format
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: You will receive a 200 OK with no body
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errorMessages\": [\n        {\n            \"propertyName\": \"paymentId\"\
                    ,\n            \"errorMessage\": \"Payment with id: pmt_XXXXXXXXXXXXXX not found\"\
                    ,\n            \"attemptedValue\": null,\n            \"customState\": null,\n   \
                    \         \"severity\": 0,\n            \"errorCode\": null,\n            \"formattedMessageArguments\"\
                    : null,\n            \"formattedMessagePlaceholderValues\": null,\n            \"\
                    resourceName\": null\n        }\n    ],\n    \"successful\": false\n}"
              schema:
                type: object
                properties:
                  errorMessages:
                    type: array
                    items:
                      type: object
                      properties:
                        propertyName:
                          type: string
                          example: paymentId
                        errorMessage:
                          type: string
                          example: 'Payment with id: pmt_XXXXXXXXXXXXXX not found'
                        attemptedValue: {}
                        customState: {}
                        severity:
                          type: integer
                          example: 0
                        errorCode: {}
                        formattedMessageArguments: {}
                        formattedMessagePlaceholderValues: {}
                        resourceName: {}
                  successful:
                    type: boolean
                    example: false
      deprecated: false
      x-readme:
        code-samples:
        - language: csharp
          code: 'await api.Payment.Delete(id);

            '
        samples-languages:
        - csharp
