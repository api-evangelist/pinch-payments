openapi: 3.1.0
info:
  title: pinch-api-payments
  version: '2020.1'
servers:
- url: https://api.getpinch.com.au/test
security:
- sec0: []
paths:
  /payments/nonce:
    post:
      summary: Check Payment Nonce
      description: ''
      operationId: check-payment-nonce
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              properties:
                nonce:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Nonce Exists:
                  value: "{\n    \"isNonceReplay\": true,\n    \"nonce\": \"fdb06000-9d3f-4738-ab45-d8d9c7984e93\"\
                    ,\n    \"data\": {\n        \"id\": \"pmt_XXXXXXXXXXXXXX\",\n        \"attemptId\"\
                    : \"att_XXXXXXXXX\",\n        \"amount\": 1000,\n        \"currency\": \"AUD\",\n\
                    \        \"description\": \"Quis molestias labore incidunt voluptate repellat magni\
                    \ recusandae et.\",\n        \"applicationFee\": 0,\n        \"totalFee\": 55,\n \
                    \       \"isSurcharged\": false,\n        \"sourceType\": \"credit-card\",\n     \
                    \   \"transactionDate\": \"2021-05-14T00:49:55.7510577Z\",\n        \"status\": \"\
                    approved\",\n        \"estimatedTransferDate\": \"2021-05-18\",\n        \"actualTransferDate\"\
                    : null,\n        \"payer\": {\n            \"id\": \"pyr_XXXXXXXXXXXXXX\",\n     \
                    \       \"firstName\": \"Alex\",\n            \"lastName\": \"Fadel\",\n         \
                    \   \"emailAddress\": \"Willis_Wyman@example.com\",\n            \"mobileNumber\"\
                    : null,\n            \"streetAddress\": null,\n            \"suburb\": null,\n   \
                    \         \"postcode\": null,\n            \"state\": null,\n            \"country\"\
                    : null,\n            \"companyName\": null,\n            \"companyRegistrationNumber\"\
                    : null,\n            \"metadata\": null\n        },\n        \"subscription\": null,\n\
                    \        \"attempts\": [\n            {\n                \"id\": \"att_XXXXXXXX\"\
                    ,\n                \"amount\": 1000,\n                \"currency\": \"AUD\",\n   \
                    \             \"convertedAmount\": null,\n                \"conversionRate\": null,\n\
                    \                \"convertedCurrency\": null,\n                \"estimatedSettlementDate\"\
                    : \"2021-05-18T00:00:00\",\n                \"isSurcharged\": false,\n           \
                    \     \"transactionDate\": \"2021-05-14T00:49:55.7510577Z\",\n                \"estimatedTransferDate\"\
