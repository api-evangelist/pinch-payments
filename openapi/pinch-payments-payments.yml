                    \                    \"applicationFee\": 0,\n                    \"totalFee\": 55,\n\
                    \                    \"currency\": \"AUD\",\n                    \"taxRate\": 0.1,\n\
                    \                    \"convertedTransactionFee\": null,\n                    \"convertedApplicationFee\"\
                    : null,\n                    \"convertedTotalFee\": null,\n                    \"\
                    convertedCurrency\": null,\n                    \"conversionRate\": null\n       \
                    \         },\n                \"status\": \"approved\"\n            }\n        ],\n\
                    \        \"refunds\": [],\n        \"metadata\": null,\n        \"nonce\": \"fdb06000-9d3f-4738-ab45-d8d9c7984e93\"\
