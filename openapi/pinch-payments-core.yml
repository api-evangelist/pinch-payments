                      example: 0
                      default: 0
                    errorCode: {}
                    formattedMessageArguments: {}
                    formattedMessagePlaceholderValues: {}
                    resourceName: {}
        '403':
          description: '403'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
      deprecated: false
      security: []
      x-readme:
        code-samples:
        - language: curl
          code: "curl https://api.getpinch.com.au/test/tokens\n -H \"Content-Type: application/json\"\
            \ \n -d \"{\n    'publishableKey': 'pk_test_hjbdslfkjhb8789oplrblsdf8bl',\n    'sourceType':\
            \ 'credit-card',\n    'cardNumber': '4242424242424242',\n    'cvc\": '123',\n    'expiryMonth':\
            \ 12,\n    'expiryYear': 2022,\n    'cardHolderName': 'Ben Hotdog'\n\t\t}\""
          name: credit-card
        - language: curl
          code: "curl https://api.getpinch.com.au/test/tokens\n -H \"Content-Type: application/json\"\
            \ \n -d \"{\n    'publishableKey': 'pk_test_hjbdslfkjhb8789oplrblsdf8bl',\n    'sourceType':\
            \ 'bank-account',\n    'bankAccountName': 'Ben Hotdog',\n    'bankAccountRoutingNumber\":\
            \ '001001',\n    'bankAccountNumber': '001001001'\n\t\t}\""
          name: bank-account
        samples-languages:
        - curl
